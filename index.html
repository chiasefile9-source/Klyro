<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Klyro — Cùng gặp lại vào Tháng 12 nhé!</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #09090b 75%);
      color: #fafafa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .glass {
      background: rgba(24, 24, 27, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(99, 102, 241, 0.15);
    }
  </style>
</head>
<body class="antialiased selection:bg-indigo-500 selection:text-white">

  <div class="glass max-w-lg w-full rounded-3xl p-8 sm:p-10 text-center">
    <div class="w-14 h-14 mx-auto mb-5 rounded-2xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center font-extrabold text-2xl text-white shadow-lg shadow-indigo-500/40">
      K
    </div>

    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-indigo-500/15 border border-indigo-400/30 text-indigo-300 text-xs font-semibold mb-4">
      <span class="w-2 h-2 rounded-full bg-sky-400 animate-pulse"></span>
      Đang nâng cấp hệ thống
    </div>

    <h1 class="text-2xl sm:text-3xl font-extrabold leading-tight mb-3 bg-gradient-to-br from-white to-slate-300 bg-clip-text text-transparent">
      Cùng gặp lại vào Tháng 12 nhé!
    </h1>

    <p class="text-zinc-400 text-sm sm:text-base leading-relaxed mb-7">
      Klyro đang hoàn thiện những mảnh ghép cuối cùng để mang đến trải nghiệm thiết kế slide mượt mà nhất. Hẹn gặp lại bạn vào <strong class="text-zinc-200">Tháng 12/2026</strong>!
    </p>

    <div class="grid grid-cols-4 gap-2.5 mb-7">
      <div class="bg-zinc-950/70 border border-white/10 rounded-2xl py-3 px-1">
        <div id="cd-days" class="text-xl sm:text-2xl font-extrabold text-sky-400">00</div>
        <div class="text-[11px] text-zinc-500 mt-0.5">Ngày</div>
      </div>
      <div class="bg-zinc-950/70 border border-white/10 rounded-2xl py-3 px-1">
        <div id="cd-hours" class="text-xl sm:text-2xl font-extrabold text-indigo-400">00</div>
        <div class="text-[11px] text-zinc-500 mt-0.5">Giờ</div>
      </div>
      <div class="bg-zinc-950/70 border border-white/10 rounded-2xl py-3 px-1">
        <div id="cd-mins" class="text-xl sm:text-2xl font-extrabold text-purple-400">00</div>
        <div class="text-[11px] text-zinc-500 mt-0.5">Phút</div>
      </div>
      <div class="bg-zinc-950/70 border border-white/10 rounded-2xl py-3 px-1">
        <div id="cd-secs" class="text-xl sm:text-2xl font-extrabold text-pink-400">00</div>
        <div class="text-[11px] text-zinc-500 mt-0.5">Giây</div>
      </div>
    </div>

    <div class="text-xs sm:text-sm text-zinc-500">
      Liên hệ hỗ trợ gấp: 
      <a href="mailto:cskh.klyro@gmail.com" class="text-indigo-400 hover:text-indigo-300 font-semibold transition">cskh.klyro@gmail.com</a>
    </div>
  </div>

  <script>
    const TARGET_DATE = new Date("2026-12-01T00:00:00+07:00");

    function updateCountdown() {
      const diff = Math.max(0, TARGET_DATE - new Date());
      if (diff === 0) { location.replace("index-main.html"); return; }
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);

      document.getElementById("cd-days").textContent = String(days).padStart(2, "0");
      document.getElementById("cd-hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("cd-mins").textContent = String(mins).padStart(2, "0");
      document.getElementById("cd-secs").textContent = String(secs).padStart(2, "0");
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
