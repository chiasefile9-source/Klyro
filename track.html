<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tra Cứu Đơn Hàng — Klyro</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #09090b; color: #fafafa; }
    .glass { background: rgba(24, 24, 27, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">

  <header class="glass border-b border-zinc-800/80">
    <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index-main.html" class="flex items-center gap-2 font-bold text-lg">
        <span class="w-7 h-7 rounded-lg bg-indigo-600 flex items-center justify-center text-sm">K</span>
        <span>Klyro</span>
      </a>
      <a href="index-main.html" class="text-sm text-zinc-400 hover:text-white transition">← Quay lại trang chủ</a>
    </div>
  </header>

  <main class="max-w-xl mx-auto w-full px-4 py-10">
    <div class="glass p-6 sm:p-8 rounded-3xl">
      <h1 class="text-2xl font-extrabold mb-1">Tra Cứu Đơn Hàng</h1>
      <p class="text-sm text-zinc-400 mb-6">Nhập mã đơn và email bạn đã dùng khi đặt để xem trạng thái.</p>

      <form id="track-form" class="space-y-4" novalidate>
        <div>
          <label for="order-id" class="block text-sm font-medium text-zinc-300 mb-1.5">Mã đơn hàng</label>
          <input id="order-id" type="text" autocomplete="off" maxlength="20" placeholder="VD: KLK7M3P" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-sm uppercase font-mono focus:outline-none focus:border-indigo-500">
        </div>
        <div>
          <label for="order-email" class="block text-sm font-medium text-zinc-300 mb-1.5">Email đã dùng khi đặt</label>
          <input id="order-email" type="email" autocomplete="email" maxlength="120" placeholder="email@gmail.com" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500">
        </div>
        <button id="track-btn" type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-bold hover:opacity-90 transition shadow-lg shadow-indigo-500/25">Kiểm tra trạng thái</button>
      </form>

      <div id="result" class="hidden mt-6 rounded-2xl border p-5 text-sm" role="status" aria-live="polite"></div>
    </div>

    <p class="text-xs text-zinc-500 text-center mt-5">Quên mã đơn? Hãy liên hệ qua email hỗ trợ ở trang chủ, kèm email bạn đã đặt hàng.</p>
  </main>

  <footer class="border-t border-zinc-800/80 py-6 px-4 text-center text-xs text-zinc-500">
    <a href="terms.html" class="hover:text-white">Điều khoản</a> ·
    <a href="privacy.html" class="hover:text-white">Bảo mật</a> ·
    <a href="refund.html" class="hover:text-white">Hoàn tiền</a>
  </footer>

  <script src="klyro-config.js"></script>
  <script>
    const form = document.getElementById('track-form');
    const idInput = document.getElementById('order-id');
    const emailInput = document.getElementById('order-email');
    const btn = document.getElementById('track-btn');
    const box = document.getElementById('result');

    const qs = new URLSearchParams(location.search);
    if (qs.get('id')) idInput.value = qs.get('id').toUpperCase().slice(0, 20);

    function show(kind, title, lines) {
      const styles = {
        ok:   'border-emerald-500/40 bg-emerald-500/10',
        warn: 'border-amber-500/40 bg-amber-500/10',
        err:  'border-rose-500/40 bg-rose-500/10'
      };
      box.className = 'mt-6 rounded-2xl border p-5 text-sm ' + styles[kind];
      box.replaceChildren();
      const h = document.createElement('div');
      h.className = 'font-bold text-base mb-2';
      h.textContent = title;
      box.appendChild(h);
      lines.forEach(([label, value]) => {
        const row = document.createElement('div');
        row.className = 'flex justify-between gap-4 py-1';
        const l = document.createElement('span');
        l.className = 'text-zinc-400';
        l.textContent = label;
        const v = document.createElement('span');
        v.className = 'font-semibold text-right break-words';
        v.textContent = value;
        row.append(l, v);
        box.appendChild(row);
      });
    }

    function message(kind, title, text) {
      box.className = 'mt-6 rounded-2xl border p-5 text-sm ' + (kind === 'err' ? 'border-rose-500/40 bg-rose-500/10' : 'border-amber-500/40 bg-amber-500/10');
      box.replaceChildren();
      const h = document.createElement('div');
      h.className = 'font-bold mb-1';
      h.textContent = title;
      const p = document.createElement('p');
      p.className = 'text-zinc-300';
      p.textContent = text;
      box.append(h, p);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const orderId = idInput.value.trim().toUpperCase();
      const email = emailInput.value.trim();

      if (!orderId || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        message('warn', 'Thiếu thông tin', 'Vui lòng nhập mã đơn và một email hợp lệ.');
        return;
      }
      if (!KLYRO_CONFIG.apiEndpoint || !KLYRO_CONFIG.apiEndpoint.startsWith('http')) {
        message('err', 'Chưa cấu hình', 'Website chưa có link kết nối. Vui lòng liên hệ hỗ trợ.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Đang kiểm tra...';
      try {
        const url = KLYRO_CONFIG.apiEndpoint + '?action=search&orderId=' + encodeURIComponent(orderId) + '&email=' + encodeURIComponent(email);
        const res = await fetch(url);
        const data = await res.json();

        if (data.status === 'found') {
          show('ok', 'Đã tìm thấy đơn hàng', [
            ['Mã đơn', data.orderId],
            ['Gói dịch vụ', data.packageName],
            ['Đặt lúc', data.createdAt || '—'],
            ['Trạng thái', data.statusText]
          ]);
        } else if (data.status === 'not_found') {
          message('warn', 'Không tìm thấy đơn', 'Mã đơn hoặc email chưa khớp. Hãy kiểm tra lại (dùng đúng email lúc đặt). Nếu vừa đặt, đợi vài phút rồi thử lại.');
        } else if (data.status === 'rate_limited') {
          message('warn', 'Bạn thử quá nhiều lần', 'Vui lòng đợi một lúc rồi thử lại, hoặc liên hệ hỗ trợ qua email.');
        } else {
          message('err', 'Không tra cứu được', 'Hệ thống đang gặp sự cố. Vui lòng thử lại sau.');
        }
      } catch (err) {
        message('err', 'Không kết nối được', 'Kiểm tra mạng của bạn rồi thử lại.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kiểm tra trạng thái';
      }
    });
  </script>
</body>
</html>
